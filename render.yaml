# PostgreSQL externo: crie um projeto Neon Free e informe sua URL com TLS.
# Este Blueprint não cria nem cobra um banco de dados no Render.
services:
  - type: web
    name: bo-online-24bpm-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BATTALION_EMAIL
        value: boletimonline24bpm@gmail.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_FROM
        sync: false
      - key: BREVO_REPLY_TO
        value: 24bpmcoroata2@gmail.com
      - key: BREVO_API_KEY
        sync: false
