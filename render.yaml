# PostgreSQL externo: crie um projeto Neon Free e informe sua URL com TLS.
# Este Blueprint não cria nem cobra um banco de dados no Render.
services:
  - type: web
    name: bo-online-24bpm-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BATTALION_EMAIL
        value: boletimonline24bpm@gmail.com
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
