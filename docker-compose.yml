services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente}
      POSTGRES_DB: bo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
