name: Validate
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bo_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://bo:ci-only-password@localhost:5432/bo_test
      TEST_DATABASE_URL: postgresql+psycopg://bo:ci-only-password@localhost:5432/bo_test
      JWT_SECRET: ci-only-secret-not-for-production-000000000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock.txt
      - run: ruff check app tests
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
